name: Release

on:
  push:
    branches:
      - main

# Only one release flow runs at a time — prevents racing Version Packages PRs.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write         # push Version Packages PR commit
  pull-requests: write    # open/update the Version Packages PR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep Node aligned with CI. Registry auth is not needed: this
      # workflow only opens Version Packages PRs. npm publish is local.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      # Publish is intentionally omitted. changesets/action with a `publish`
      # script treats a merged Version Packages PR as "ship to npm", but
      # Actions NPM_TOKEN cannot publish @dashcommerce/* (E404 on PUT).
      # Shipping is `npm publish --access public` from packages/core.
      # Reversible: restore `publish: bun run release` if Actions npm auth
      # is ever wired up for real.
      - name: Create Version Packages PR
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
